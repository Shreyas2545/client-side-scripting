<!DOCTYPE html>
<html ng-app="myApp">

<head>
    <title>Angular Button Color Change</title>

    <!-- AngularJS CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>

<body ng-controller="myCtrl">

    <button ng-click="changeColor()"
        ng-style="{'background-color': btnColor, 'color':'black', 'padding':'10px 20px', 'border':'2px solid black', 'border-radius': '20px'}">
        Click Me
    </button>

    <script>
        var app = angular.module("myApp", []);

        app.controller("myCtrl", function ($scope) {
            $scope.btnColor = "greenyellow";

            $scope.changeColor = function () {

                if ($scope.btnColor == "greenyellow") {
                    $scope.btnColor = "pink";
                } else {
                    $scope.btnColor = "greenyellow";
                }
            };
        });
    </script>

</body>

</html>
