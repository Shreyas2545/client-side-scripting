<!DOCTYPE html>
<html ng-app="myApp">

<head>
    <title>Mouse Events Coordinates</title>

    <!-- AngularJS CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>

<body ng-controller="myCtrl">

    <div ng-mouseenter="getCoords($event, 'Mouse Enter')" ng-mousemove="getCoords($event, 'Mouse Move')"
        ng-click="getCoords($event, 'Mouse Click')" style="
        width:400px;
        height:200px;
        padding:20px;
        background-image: url('./rohit.webp');
        background-size: cover;
        background-position: center;
     ">
    </div>


    <p> Event: {{eventName}}</p>
    <p> X Coordinate: {{x}}</p>
    <p> Y Coordinate: {{y}}</p>

    <script>
        var app = angular.module("myApp", []);

        app.controller("myCtrl", function ($scope) {
            $scope.x = 0;
            $scope.y = 0;
            $scope.eventName = "None";

            $scope.getCoords = function (event, name) {
                $scope.x = event.clientX;
                $scope.y = event.clientY;
                $scope.eventName = name;
            };
        });
    </script>

</body>

</html>
