<!DOCTYPE html>
<html ng-app="studentApp">
<head>
    <title>Student Information Form</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <style>
        body{
            font-family: 'Times New Roman', Times, serif;
            margin:40px;
        }

        input, button{
            padding:8px;
            margin:6px;
        }

        table{
            width:75%;
            border-collapse: collapse;
            margin-top:20px;
        }

        th, td{
            border:1px solid black;
            padding:10px;
            text-align:center;
        }

        th{
            background-color:#f2f2f2;
            cursor:pointer;
        }
    </style>
</head>

<body ng-controller="StudentController">

<h2>Student Information Form</h2>

<form ng-submit="addStudent()">

    <input type="text"
           placeholder="First Name"
           ng-model="student.firstName"
           required>

    <input type="text"
           placeholder="Last Name"
           ng-model="student.lastName"
           required>

    <input type="date"
           ng-model="student.dob"
           required>

    <input type="number"
           placeholder="Percentage"
           ng-model="student.percentage"
           min="0" max="100"
           required>

    <button type="submit">Add Student</button>

</form>


<table>

    <tr>
        <th>Full Name</th>
        <th>Date of Birth</th>

        <th ng-click="sortBy('percentage')">
            Percentage ▲▼
        </th>
    </tr>

    <tr ng-repeat="s in students | orderBy:sortColumn:reverseSort">
        <td>{{s.firstName + ' ' + s.lastName}}</td>
        <td>{{s.dob | date:'dd/MM/yyyy'}}</td>
        <td>{{s.percentage}}%</td>
    </tr>

</table>


<script>
angular.module("studentApp", [])
.controller("StudentController", function($scope){

    $scope.students = [];

    $scope.sortColumn = 'percentage';
    $scope.reverseSort = false;

    $scope.addStudent = function(){
        $scope.students.push(angular.copy($scope.student));
        $scope.student = {};
    };

    $scope.sortBy = function(column){
        if($scope.sortColumn === column){
            $scope.reverseSort = !$scope.reverseSort;
        }else{
            $scope.sortColumn = column;
            $scope.reverseSort = false;
        }
    };

});
</script>

</body>
</html>
