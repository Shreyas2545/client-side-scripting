<!DOCTYPE html>
<!-- Associating module to ng-app -->
<html lang="en" ng-app="myModule">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="script1.js"></script>
</head>
<body>
    <!-- Associating controller function to ng-controller -->
    <div ng-controller="myController" ng-style="styleData">
        <label>Name:</label>
        <input type="text" ng-model="userName" ng-style="{'height':'50px','font-size':'50px'}">
        <p>Hello, {{userName}}!</p>
    </div>
</body>
</html>
